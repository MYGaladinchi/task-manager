<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple task manager app built with vanilla JavaScript">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Task Manager</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section id="add-task-section">
      <form id="taskForm">
        <label for="taskInput">New Task</label>
        <input type="text" id="taskInput" placeholder="e.g. Buy groceries" required>
        <button type="submit">Add Task</button>
      </form>
    </section>

    <section id="task-list-section">
      <h2>Your Tasks</h2>
      <ul id="taskList">
        <!-- Tasks will be added here dynamically by JavaScript -->
      </ul>
    </section>
  </main>

  <footer>
    <p>Project 1 — MERN Course, built with HTML, CSS, and vanilla JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
